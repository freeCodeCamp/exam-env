name: "pr-title"

# Squash-merging uses the PR title as the commit subject, and release-please
# derives the next version and changelog from those subjects. An unconventional
# title silently produces no version bump and no changelog entry, so it is
# validated here rather than discovered at release time.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  lint-pr-title:
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with changelog-sections in release-please-config.json
          types: |
            feat
            fix
            perf
            refactor
            revert
            chore
            dev
            build
            ci
            docs
            test
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of pull request "{title}" should start with a lowercase character.
